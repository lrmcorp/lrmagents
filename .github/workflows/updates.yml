name: LRMagent update check

# Weekly: is there a newer upstream agent image or WhatsApp library than the
# pinned ones? Opens (or updates) one issue; nothing is changed automatically,
# because both can break things (README "Updating the upstream version").
on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: 'LRMagent update available'
    steps:
      - uses: actions/checkout@v5
      - name: Compare pinned versions with the latest releases
        run: |
          pinned_image="$(grep -oE 'sha256:[0-9a-f]{64}' deploy/Dockerfile | head -1)"
          latest_image="$(docker buildx imagetools inspect zhayujie/chatgpt-on-wechat:latest | awk '/^Digest:/ {print $2; exit}')"
          pinned_wa="$(python3 -c 'import json; print(json.load(open("whatsapp-gateway/package.json"))["dependencies"]["baileys"])')"
          latest_wa="$(npm view baileys dist-tags.latest)"
          echo "image: pinned $pinned_image, latest ${latest_image:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "baileys: pinned $pinned_wa, latest ${latest_wa:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          : > updates.md
          if [[ -n "$latest_image" && "$latest_image" != "$pinned_image" ]]; then
            echo "- **Agent base image:** a newer \`zhayujie/chatgpt-on-wechat:latest\` is out (\`$latest_image\`, pinned \`$pinned_image\`). Update the digest in \`deploy/Dockerfile\` and \`deploy/compose.yaml\`; the deploy's build step checks every brand patch still applies." >> updates.md
          fi
          if [[ -n "$latest_wa" && "$latest_wa" != "$pinned_wa" ]]; then
            echo "- **WhatsApp library (Baileys):** $latest_wa is out (pinned $pinned_wa). WhatsApp protocol changes can break older versions; bump it in \`whatsapp-gateway/package.json\`, run \`npm install\` and the tests." >> updates.md
          fi
      - name: Open or update the issue
        run: |
          issue="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [[ ! -s updates.md ]]; then echo "Up to date."; exit 0; fi
          body="$(printf 'Checked %s UTC:\n\n' "$(date -u '+%Y-%m-%d')"; cat updates.md)"
          if [[ -z "$issue" ]]; then
            gh issue create --title "$TITLE" --body "$body"
          elif [[ "$(gh issue view "$issue" --json comments,body --jq '(.comments | last | .body) // .body' | grep '^- ')" != "$(cat updates.md)" ]]; then
            gh issue comment "$issue" --body "$body"
          fi
