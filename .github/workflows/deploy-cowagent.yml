name: Deploy LRMagent to Tencent Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cowagent-vps
  cancel-in-progress: false

jobs:
  # Everything that can be checked without the VPS. A failure here stops the deploy.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: WhatsApp gateway tests
        working-directory: whatsapp-gateway
        run: npm ci --no-audit --no-fund && npm test
      - name: Script and code syntax
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          python3 -m py_compile deploy/brand/apply.py deploy/agent-tools/*.py deploy/agent-tools/*/*.py
          node --check deploy/brand/vault.js
          for f in .github/workflows/*.yml; do python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"; done
      - name: Compose file
        run: |
          docker network create lnint-edge
          touch .env.cowagent .env.whatsapp
          docker compose -f deploy/compose.yaml config --quiet
      # Builds both images exactly as the VPS will; apply.py fails the build if any
      # brand patch no longer matches the pinned upstream image.
      - name: Build images
        run: docker compose -f deploy/compose.yaml build

  deploy:
    needs: validate
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VPS: ubuntu@43.152.240.47
      # Keep in sync with the AGENT_DOMAIN variable in lrmcorp/ln; first host is the public URL.
      AGENT_DOMAIN: ${{ vars.AGENT_DOMAIN || 'agent.lnint.xyz' }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare pinned SSH identity
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ln_vps"
          cp deploy/known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ln_vps" "$HOME/.ssh/known_hosts"
          ssh-keygen -F 43.152.240.47 -f "$HOME/.ssh/known_hosts" >/dev/null
          echo "SSH=ssh -i $HOME/.ssh/ln_vps -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
      - name: Upload deploy files
        run: |
          printf '%s\n' "$GITHUB_SHA" > .deploy-revision
          $SSH "$VPS" 'mkdir -p ~/cowagent'
          rsync -az --delete -e "$SSH" --exclude='.git/' --exclude='.env*' ./ "$VPS":~/cowagent/
      # Secrets travel over stdin, never on a command line. Blank values are omitted so keys saved in the web console survive.
      - name: Write server environment
        env:
          WEB_PASSWORD: ${{ secrets.COWAGENT_WEB_PASSWORD }}
          MODEL: ${{ vars.COWAGENT_MODEL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional backup models, e.g. "claudeAPI:claude-sonnet-5-5,openai:gpt-5.5". Unset leaves
          # the fallback chain to Config -> Models -> Main Model -> Fallback in the console.
          MODEL_FALLBACK: ${{ vars.LRMAGENT_MODEL_FALLBACK }}
          # Optional prices for the Usage page: {"model-prefix": [usd_per_M_input, usd_per_M_output]}.
          LRMAGENT_PRICES: ${{ vars.LRMAGENT_PRICES }}
        run: |
          host="${AGENT_DOMAIN%%,*}"; export WEB_PUBLIC_URL="https://${host// /}"
          if [[ ${#WEB_PASSWORD} -lt 12 ]]; then
            echo '::error::Set the COWAGENT_WEB_PASSWORD secret (12+ characters); the console is public and the agent has shell access.'
            exit 1
          fi
          if [[ -n "$MODEL_FALLBACK" ]]; then
            # A Python literal: LRMagent reads dict-valued settings from the environment with ast.literal_eval.
            CHAT_FALLBACK="$(python3 -c 'import sys
          links = [part.split(":", 1) for part in sys.argv[1].split(",") if ":" in part]
          chain = [{"provider": p.strip(), "model": m.strip()} for p, m in links if p.strip() and m.strip()]
          print(repr({"enabled": bool(chain), "chain": chain}))' "$MODEL_FALLBACK")"
            export CHAT_FALLBACK
            echo "Model fallback: $CHAT_FALLBACK" >> "$GITHUB_STEP_SUMMARY"
          fi
          for name in WEB_PASSWORD WEB_PUBLIC_URL MODEL CHAT_FALLBACK LRMAGENT_PRICES CLAUDE_API_KEY OPEN_AI_API_KEY DEEPSEEK_API_KEY GEMINI_API_KEY; do
            if [[ -n "${!name}" ]]; then printf '%s=%s\n' "$name" "${!name}"; fi
          done | $SSH "$VPS" 'umask 077 && cat > ~/cowagent/.env.cowagent'
          # The WhatsApp gateway talks to LRMagent through its OpenAI-compatible API with
          # a token generated once on the server and never leaving it.
          $SSH "$VPS" 'umask 077 && cd ~/cowagent && { test -s .env.api-token || openssl rand -hex 32 > .env.api-token; } \
            && token="$(cat .env.api-token)" \
            && printf "EXTERNAL_API_ENABLED=True\nEXTERNAL_API_TOKEN=%s\n" "$token" >> .env.cowagent \
            && printf "COWAGENT_API_TOKEN=%s\n" "$token" > .env.whatsapp'
      - name: Start and verify LRMagent
        run: |
          $SSH "$VPS" "cd ~/cowagent && test \"\$(cat .deploy-revision)\" = '$GITHUB_SHA' \
            && (sudo -n docker network inspect lnint-edge >/dev/null 2>&1 || sudo -n docker network create lnint-edge) \
            && sudo -n docker compose -f deploy/compose.yaml build --pull \
            && sudo -n docker compose -f deploy/compose.yaml up -d --remove-orphans \
            && curl -fsS --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:9899/ >/dev/null \
            && sudo -n docker compose -f deploy/compose.yaml exec -T whatsapp-gateway node -e \"(async()=>{for(let i=0;i<15;i++){try{console.log(await (await fetch('http://127.0.0.1:8080/whatsapp/health')).text());return}catch{await new Promise(r=>setTimeout(r,2000))}}process.exit(1)})()\""
      # 02:17 Jakarta time. Idempotent: the tagged line is replaced on every deploy.
      - name: Schedule nightly backups
        run: |
          $SSH "$VPS" 'mkdir -p ~/backups && chmod 700 ~/backups \
            && line="17 19 * * * bash \$HOME/cowagent/deploy/backup.sh >> \$HOME/backups/lrmagent-backup.log 2>&1 # lrmagent-backup" \
            && { crontab -l 2>/dev/null | grep -v "# lrmagent-backup"; echo "$line"; } | crontab - \
            && crontab -l | grep -c "# lrmagent-backup" \
            && { ls ~/backups/lrmagent/*.tar.gz >/dev/null 2>&1 || bash ~/cowagent/deploy/backup.sh; }'
      # Hourly two-way sync of the knowledge vault with a private repo (README "Second brain").
      # The VPS makes its own deploy key; only the public half is shown here.
      - name: Set up vault sync
        env:
          VAULT_REPO: ${{ vars.LRMAGENT_VAULT_REPO }}
          BACKUP_PASSPHRASE: ${{ secrets.LRMAGENT_BACKUP_PASSPHRASE }}
        run: |
          if [[ -z "$VAULT_REPO" ]]; then
            $SSH "$VPS" '{ crontab -l 2>/dev/null | grep -v "# lrmagent-vault"; } | crontab -; rm -f ~/.lrmagent-backup-pass ~/.lrmagent-offsite-repo'
            echo "Vault sync: off (set the LRMAGENT_VAULT_REPO variable to turn it on)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$VAULT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::LRMAGENT_VAULT_REPO must look like owner/repo"; exit 1; }
          pub="$($SSH "$VPS" "command -v git >/dev/null || sudo -n apt-get install -y -q git >/dev/null; \
            mkdir -p ~/vault-sync ~/.ssh && chmod 700 ~/.ssh \
            && { test -f ~/.ssh/lrmagent_vault || ssh-keygen -q -t ed25519 -N '' -C lrmagent-vault@vps -f ~/.ssh/lrmagent_vault; } \
            && cp ~/cowagent/deploy/github_known_hosts ~/vault-sync/known_hosts \
            && line='41 * * * * bash \$HOME/cowagent/deploy/vault-sync.sh $VAULT_REPO >> \$HOME/vault-sync/sync.log 2>&1 # lrmagent-vault' \
            && { crontab -l 2>/dev/null | grep -v '# lrmagent-vault'; echo \"\$line\"; } | crontab - \
            && cat ~/.ssh/lrmagent_vault.pub")"
          # Off-site backups: encrypted with this passphrase, pushed to the same private repo.
          if [[ -n "$BACKUP_PASSPHRASE" ]]; then
            printf '%s\n' "$BACKUP_PASSPHRASE" | $SSH "$VPS" "umask 077 && cat > ~/.lrmagent-backup-pass && printf '%s\n' '$VAULT_REPO' > ~/.lrmagent-offsite-repo"
            echo "Off-site backups: nightly, encrypted, to $VAULT_REPO (branch backups)." >> "$GITHUB_STEP_SUMMARY"
          else
            $SSH "$VPS" 'rm -f ~/.lrmagent-backup-pass ~/.lrmagent-offsite-repo'
            echo "Off-site backups: off (add the LRMAGENT_BACKUP_PASSPHRASE secret to turn them on)." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "### Vault sync: $VAULT_REPO (hourly)"
            echo "Add this as a **deploy key with write access** in $VAULT_REPO → Settings → Deploy keys:"
            echo '```'; echo "$pub"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public console
        continue-on-error: true
        run: |
          host="${AGENT_DOMAIN%%,*}"; host="${host// /}"
          addresses="$(getent ahostsv4 "$host" | awk '{print $1}' | sort -u || true)"
          echo "$host A: ${addresses:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$addresses" != '43.152.240.47' ]]; then
            echo "::warning::$host does not resolve to the VPS yet; console is reachable only via SSH tunnel."
            exit 0
          fi
          curl -fsSL --connect-timeout 5 --max-time 12 --retry 5 --retry-delay 3 --retry-all-errors "https://$host/" -o /dev/null
          echo "https://$host is up." >> "$GITHUB_STEP_SUMMARY"
