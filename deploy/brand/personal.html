<body>
<div class="stage"><canvas id="orb" aria-label="Tap to talk"></canvas><div class="name" id="name">LRM</div><div class="state" id="state">starting</div></div>
<div class="hud" id="hud"></div>
<div class="top"><span id="who">Personal</span><a href="/assets/brand/personal.html" target="_blank" rel="noopener" title="Open on its own (phone: add to home screen)"><i class="fa-solid fa-up-right-from-square"></i></a></div>
<div class="cam" id="cam"><video id="video" playsinline muted></video><canvas id="boxes"></canvas>
  <button class="look" id="look"><i class="fa-solid fa-eye"></i> What do you see?</button><div class="seen" id="seen"></div></div>
<div class="subs"><div class="you" id="you"></div><div class="it" id="it"></div></div>

<div class="bar">

  <button id="camera" title="Camera: let it see" aria-pressed="false"><i class="fa-solid fa-camera"></i><span class="l">Camera</span></button>
  <button id="keyboard" title="Type a message" aria-pressed="false"><i class="fa-regular fa-keyboard"></i></button>
  <button id="mute" title="Spoken answers on/off" aria-pressed="false"><i class="fa-solid fa-volume-high"></i></button>
  <select id="voice" title="Sora's voice"><option value="device">Fast voice</option><option value="server">Sora voice (slower)</option></select>
  <select id="lang" title="Language you speak"><option value="">Auto</option><option value="en">English</option><option value="id">Bahasa Indonesia</option><option value="zh">中文</option></select>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {

  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private */ } } };

    handsFree: false, busy: false, queue: [], agent: null, detector: null, camOn: false, lastSeen: [] };
  // Safari says only "the string did not match the expected pattern" when a reply is not JSON.

    const text = await r.text();
    try { return JSON.parse(text); } catch {
      const plain = text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160);
      throw new Error(r.status === 401 ? 'Your sign-in expired: open the console and sign in again.' : `the server answered ${r.status}${plain ? `: ${plain}` : ''}`);

  }
  function toast(t) { const el = $('#toast'); el.textContent = t; el.title = 'Tap to close'; el.onclick = () => { el.style.display = 'none'; }; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, Math.max(6000, String(t).length * 60)); }
  function setState(s, label) { S.state = s; $('#state').textContent = label || ({ idle: 'tap to talk', listening: 'listening', thinking: 'thinking', speaking: 'speaking' }[s] || s); }

  // ---- the orb ---------------------------------------------------------------------
  const cv = $('#orb'); const g = cv.getContext('2d'); let t0 = performance.now();
  function size() { const d = Math.min(devicePixelRatio || 1, 2); const r = cv.getBoundingClientRect(); cv.width = r.width * d; cv.height = r.height * d; g.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener('resize', () => { size(); if (S.panels) showHud(S.panels); }); size();
  function draw(now) {
    requestAnimationFrame(draw);
    const w = cv.clientWidth; const h = cv.clientHeight; const cx = w / 2; const cy = h / 2; const t = (now - t0) / 1000;

    const breathe = S.state === 'idle' ? 0.02 * Math.sin(t * 1.6) : 0;
    const R = w * 0.27 * (1 + breathe + live * 0.22);
    g.clearRect(0, 0, w, h);

    const glow = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.9);

    g.lineWidth = Math.max(3, w * 0.018); g.strokeStyle = '#ff2d55'; g.shadowColor = '#ff2d55'; g.shadowBlur = 24 + live * 40;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
    g.shadowBlur = 0;

    g.save(); g.translate(cx, cy); g.rotate(t * (S.state === 'thinking' ? 1.4 : 0.15));

      const a = (i / 72) * Math.PI * 2; const long = i % 6 === 0; const r1 = R * 1.22; const r2 = r1 + (long ? 12 : 5);

    g.save(); g.translate(cx, cy);

      g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 2, 0, Math.PI * 2); g.fill();

  requestAnimationFrame(draw);

  // ---- audio in ----------------------------------------------------------------------
  async function mic() {
    if (S.stream) return S.stream;
    S.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    S.ctx = S.ctx || new (window.AudioContext || window.webkitAudioContext)();
    const src = S.ctx.createMediaStreamSource(S.stream);
    S.analyser = S.ctx.createAnalyser(); S.analyser.fftSize = 1024; src.connect(S.analyser);

      requestAnimationFrame(meter);

      // so a fan or traffic is not taken for speech.

        return;

      if (voiced) {

        S.voiceRun = S.voiceRun || now;

  // ---- live transcription in the browser (Chrome, Edge, Safari) -------------------------
  // It writes down what the owner says while they speak, so the words are ready the moment
  // they stop; the server (Whisper) is only the fallback, as it needs several seconds.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const BCP = { en: 'en-US', id: 'id-ID', zh: 'zh-CN' };
  function liveLang() {
    const chosen = $('#lang').value;
    if (chosen) return chosen;
    return store.get('lrm_p_heard', '') || ({ id: 'id', zh: 'zh' }[String(navigator.language).slice(0, 2)] || 'en');
  }
  function liveStart() {
    S.live = null;
    if (!SR) return;
    try {
      const r = new SR();
      const lang = liveLang();
      r.lang = BCP[lang] || 'en-US'; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
      const live = { rec: r, lang, final: '', interim: '', ok: true, ended: false, done: null };

        for (const res of e.results) { if (res.isFinal) fin += res[0].transcript + ' '; else mid += res[0].transcript; }

      if (['en', 'id', 'zh'].includes(data.language)) store.set('lrm_p_heard', data.language); // live transcription follows it
      await ask(data.text, { lang: data.language });
    } catch (e) { S.busy = false; setState('idle'); toast(`Couldn't understand the audio: ${e.message}`); }
  }

  // A conversation: after Sora answers she listens again by herself, until the owner says
  // nothing for a few seconds (or taps Talk to end it). Hands-free does its own listening.
  function listenAgain() {
    if (!S.conversation || S.handsFree || S.rec || S.busy || S.speaking) return;
    setTimeout(() => { if (S.conversation && !S.rec && !S.busy && !S.speaking) startRec(); }, 350);
  }

  // ---- talking to the assistant ------------------------------------------------------
  async function ask(text, { lang = '', image = null } = {}) {
    S.busy = true; $('#you').textContent = text ? `“${text}”` : ''; $('#it').textContent = ''; setState('thinking');
    try {
      const r = await fetch('/api/lrm/voice?op=chat', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, lang: lang || $('#lang').value || '', image }) });
      const data = await readJson(r);
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      showHud(data.hud || []);
      $('#it').textContent = data.text || '';
      S.busy = false;
      if (data.text && !S.muted) await speak(data.text, lang); else setState('idle');
      S.turns = (S.turns || 0) + 1;
      listenAgain();
    } catch (e) { S.busy = false; S.conversation = false; setState('idle'); toast(e.message); }
  }

  // ---- audio out: sentence by sentence, so it starts talking quickly --------------------
  function sentences(text) { return (text.match(/[^.!?。！？]+[.!?。！？]*/g) || [text]).map((s) => s.trim()).filter(Boolean).reduce((a, s) => { if (a.length && (a[a.length - 1] + ' ' + s).length < 140) a[a.length - 1] += ' ' + s; else a.push(s); return a; }, []); }
  async function tts(text, lang) {
    const r = await fetch('/api/lrm/voice?op=tts', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, lang }) });
    if (!r.ok) { let m = `HTTP ${r.status}`; try { m = (await r.json()).error || m; } catch { /* audio */ } throw new Error(m); }
    return r.arrayBuffer();
  }
  // ---- the device's own voices: they start at once (the server needs seconds per sentence) --
  const FEMALE = /female|samantha|karen|moira|tessa|serena|victoria|zira|aria|jenny|ava|allison|susan|fiona|veena|damayanti|tingting|meijia|sinji|xiaoxiao|xiaoyi|huihui|yaoyao|google (uk english female|us english|bahasa indonesia|普通话|國語)/i;
  const MALE = /\bmale\b|daniel|alex|fred|thomas|rishi|aaron|arthur|gordon|oliver|reed|rocko|eddy|grandpa|ralph|albert|bruce|junior|kangkang|yunyang|yunxi|ardi/i;
  function guessLang(text) {
    if (/[\u4e00-\u9fff]/.test(text)) return 'zh';
    const id = (text.toLowerCase().match(/\b(yang|dan|tidak|saya|anda|kamu|ini|itu|untuk|dengan|sudah|akan|bisa|ada|ya|juga|dari)\b/g) || []).length;
    return id >= 2 ? 'id' : 'en';
  }
  function deviceVoice(lang) {
    if (!window.speechSynthesis) return null;
    const all = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().replace('_', '-').startsWith(lang));
    if (!all.length) return null;
    const score = (v) => (FEMALE.test(v.name) ? 4 : 0) - (MALE.test(v.name) ? 4 : 0) + (v.localService ? 1 : 0)
      + (/premium|enhanced|natural|neural/i.test(v.name) ? 2 : 0) + (lang === 'en' && /en-(us|gb)/i.test(v.lang) ? 1 : 0);
    return all.sort((a, b) => score(b) - score(a))[0];
  }
  try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch { /* none */ }
  function speakDevice(text, voice, token) {
    return new Promise((resolve, reject) => {
      const synth = speechSynthesis; synth.cancel();
      const parts = sentences(text); let i = 0;
      token.stop = () => { synth.cancel(); resolve(); };
      const t0 = performance.now();
      (function meter() { if (S.speaking !== token) return; const t = (performance.now() - t0) / 1000; S.out = synth.speaking ? 0.35 + 0.25 * Math.abs(Math.sin(t * 7.3)) + 0.15 * Math.abs(Math.sin(t * 13.1)) : 0; requestAnimationFrame(meter); })();
      const next = () => {
        if (S.speaking !== token || i >= parts.length) return resolve();
        const u = new SpeechSynthesisUtterance(parts[i++]);
        u.voice = voice; u.lang = voice.lang; u.rate = 1.03; u.pitch = 1.05;
        u.onend = next;
        u.onerror = (e) => (['interrupted', 'canceled'].includes(e.error) ? resolve() : reject(Object.assign(new Error(e.error), { device: true })));
        synth.speak(u);
      };
      next();
    });
  }

  async function speak(text, lang) {
    releaseMic(); session('playback');
    const token = {}; S.speaking = token; setState('speaking');
    const L = guessLang(text); // the language of the answer decides the voice
    const voice = $('#voice').value === 'device' ? deviceVoice(L) : null;
    if (voice) {
      try { await speakDevice(text, voice, token); if (S.speaking === token) { S.speaking = null; S.out = 0; setState('idle'); } return; }
      catch (e) { if (S.speaking !== token) return; /* the device voice failed: Sora's voice from the server instead */ }
    }
    const parts = sentences(text); let next = tts(parts[0], lang || L);
    try {
      for (let i = 0; i < parts.length; i++) {
        const wav = await next;
        if (i + 1 < parts.length) next = tts(parts[i + 1], lang || L);
        if (S.speaking !== token) return;
        await play(wav, token);
      }
    } catch (e) {
      if (S.speaking === token) toast(e?.name === 'NotAllowedError' ? 'The browser blocked the voice. Tap the orb once, then ask again.' : `Voice unavailable: ${e.message}`);
    }
    if (S.speaking === token) { S.speaking = null; S.out = 0; setState('idle'); }
  }
  function play(wav, token) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
      const done = () => { URL.revokeObjectURL(url); player.onended = player.onerror = null; S.out = 0; resolve(); };
      player.onended = done; player.onerror = () => done();
      token.stop = () => { player.pause(); done(); };
      player.src = url;
      player.play().then(() => {
        S.unlocked = true;
        // the orb moves with the voice (a media element has no level meter on every phone)
        const t0 = performance.now();
        (function meter() { if (S.speaking !== token || player.paused) return; const t = (performance.now() - t0) / 1000; S.out = 0.35 + 0.25 * Math.abs(Math.sin(t * 7.3)) + 0.15 * Math.abs(Math.sin(t * 13.1)); requestAnimationFrame(meter); })();
      }).catch((e) => { URL.revokeObjectURL(url); player.onended = player.onerror = null; reject(e); });
    });
  }
  function stopSpeaking() { const t = S.speaking; S.speaking = null; S.out = 0; if (t?.stop) t.stop(); }

  // ---- HUD panels --------------------------------------------------------------------
  function chart(labels, values) {
    const max = Math.max(1, ...values.map(Number).filter(Number.isFinite)); const n = values.length || 1; const bw = 100 / n;
    return `<svg viewBox="0 0 100 60" preserveAspectRatio="none">${values.map((v, i) => { const h = (Number(v) || 0) / max * 48; return `<rect x="${i * bw + bw * 0.18}" y="${52 - h}" width="${bw * 0.64}" height="${h}" fill="#f4f4f6"/>`; }).join('')}
      <line x1="0" y1="52.5" x2="100" y2="52.5" stroke="rgba(255,255,255,.4)" stroke-width=".4"/></svg>
      <div class="sub" style="display:flex;justify-content:space-between">${labels.slice(0, 8).map((l) => `<span>${esc(l)}</span>`).join('')}</div>`;
  }
  function card(p) {
    const title = p.title ? `<h4>${esc(p.title)}</h4>` : '';
    if (p.type === 'stat') return `${title}<div class="val">${esc(p.value)}</div>${p.sub ? `<div class="sub">${esc(p.sub)}</div>` : ''}`;
    if (p.type === 'chart') return `${title}${chart(p.labels || [], p.values || [])}`;
    if (p.type === 'list') return `${title}<ul>${(p.items || []).slice(0, 8).map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`;
    if (p.type === 'image' && /^https?:\/\//.test(p.url || '')) return `${title}<img src="${esc(p.url)}" alt="${esc(p.title || '')}" referrerpolicy="no-referrer" loading="lazy">`;
    return `${title}<p>${esc(p.body || p.text || '')}</p>`;
  }
  function showHud(panels) {
    S.panels = panels;
    const hud = $('#hud'); hud.innerHTML = '';
    if (!panels.length) return;
    const W = innerWidth; const H = innerHeight; const small = W < 760;
    // around the orb; the camera view takes the top right when it is on
    const camBottom = S.camOn ? $('#cam').getBoundingClientRect().bottom + 14 : 0;
    const right = (y) => Math.max(y, camBottom);
    const spots = small
      ? [[12, 64], [W / 2 + 6, S.camOn ? camBottom : 64], [12, 210], [W / 2 + 6, Math.max(210, camBottom + 150)]]
      : [[W * 0.04, H * 0.1], [W * 0.04, H * 0.4], [W * 0.73, right(H * 0.12)], [W * 0.73, right(H * 0.12) + H * 0.3], [W * 0.04, H * 0.68], [W * 0.73, Math.min(H * 0.74, right(H * 0.12) + H * 0.58)]];
    panels.slice(0, spots.length).forEach((p, i) => {
      const el = document.createElement('div'); el.className = 'card'; el.style.left = `${spots[i][0]}px`; el.style.top = `${spots[i][1]}px`; el.style.animationDelay = `${i * 0.08}s`;
      el.innerHTML = card(p); hud.appendChild(el);
    });
  }

  // ---- camera: live object boxes, and "what do you see" -----------------------------
  async function camera(on) {
    const box = $('#cam'); const video = $('#video');
    $('#camera').setAttribute('aria-pressed', String(on));
    if (!on) { S.camOn = false; box.classList.remove('on'); showHud(S.panels || []); video.srcObject?.getTracks().forEach((t) => t.stop()); video.srcObject = null; return; }
    try {
      video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: store.get('lrm_p_facing', 'user'), width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      await video.play(); S.camOn = true; box.classList.add('on'); showHud(S.panels || []); detect();
    } catch (e) { $('#camera').setAttribute('aria-pressed', 'false'); toast(e?.name === 'NotAllowedError' ? 'Camera permission was refused.' : `No camera: ${e.message || e}`); }
  }
  async function loadDetector() {
    if (S.detector || S.detectorFailed) return S.detector;
    try {
      if (!window.Vision) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = '/assets/brand/vendor/mediapipe/vision_bundle.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
      const files = await window.Vision.FilesetResolver.forVisionTasks('/assets/brand/vendor/mediapipe/wasm');
      const make = (delegate) => window.Vision.ObjectDetector.createFromOptions(files, { baseOptions: { modelAssetPath: '/assets/brand/vendor/mediapipe/efficientdet_lite0.tflite', delegate }, runningMode: 'VIDEO', scoreThreshold: 0.45, maxResults: 6 });
      try { S.detector = await make('GPU'); } catch { S.detector = await make('CPU'); }
    } catch { S.detectorFailed = true; }
    return S.detector;
  }
  async function detect() {
    const det = await loadDetector(); const video = $('#video'); const c = $('#boxes'); const ctx = c.getContext('2d'); let last = -1;
    (function loop() {
      if (!S.camOn) { ctx.clearRect(0, 0, c.width, c.height); return; }
      requestAnimationFrame(loop);
      if (!det || video.readyState < 2 || video.currentTime === last) return;
      last = video.currentTime;
      c.width = video.videoWidth; c.height = video.videoHeight;
      let res; try { res = det.detectForVideo(video, performance.now()); } catch { return; }
      ctx.clearRect(0, 0, c.width, c.height); ctx.lineWidth = Math.max(2, c.width / 300); ctx.font = `${Math.max(14, c.width / 40)}px ui-monospace, monospace`;
      S.lastSeen = [];
      for (const d of res.detections || []) {
        const b = d.boundingBox; const name = d.categories?.[0]?.categoryName || 'object'; S.lastSeen.push(name);
        ctx.strokeStyle = '#ff2d55'; ctx.fillStyle = 'rgba(255,45,85,.16)';
        ctx.fillRect(b.originX, b.originY, b.width, b.height); ctx.strokeRect(b.originX, b.originY, b.width, b.height);
        // the canvas is mirrored with the video: write the label mirrored back
        ctx.save(); ctx.scale(-1, 1); ctx.fillStyle = '#ff2d55';
        const label = `${name} ${Math.round((d.categories?.[0]?.score || 0) * 100)}%`; const tw = ctx.measureText(label).width;
        ctx.fillRect(-(b.originX + b.width), b.originY - 22, tw + 10, 22); ctx.fillStyle = '#fff'; ctx.fillText(label, -(b.originX + b.width) + 5, b.originY - 6); ctx.restore();
      }
      $('#seen').textContent = S.lastSeen.length ? [...new Set(S.lastSeen)].join(' · ') : '';
    })();
  }
  function frame() {
    const v = $('#video'); if (!S.camOn || !v.videoWidth) return null;
    const c = document.createElement('canvas'); const scale = Math.min(1, 1024 / v.videoWidth); c.width = v.videoWidth * scale; c.height = v.videoHeight * scale;
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.82);
  }

  // ---- controls ----------------------------------------------------------------------
  const talk = $('#talk'); let pressAt = 0;
  talk.addEventListener('pointerdown', (e) => {
    e.preventDefault(); unlock(); pressAt = Date.now();
    if (S.rec) { S.held = false; stopRec(); return; }
    if (S.conversation && (S.busy || S.speaking)) { S.conversation = false; stopSpeaking(); setState(S.busy ? 'thinking' : 'idle'); toast('Conversation ended. Tap Talk to start again.'); return; }
    S.conversation = true; S.turns = 0; S.held = true; startRec();
  });
  // Held = push-to-talk (ends on release); a tap = talk, and it ends by itself when you stop.
  const release = () => { const held = S.held; S.held = false; if (S.rec && held && Date.now() - pressAt > 450) { S.conversation = false; stopRec(); } };
  talk.addEventListener('pointerup', release);
  talk.addEventListener('pointercancel', release);
  // The orb: while Sora speaks, a tap interrupts her and listens at once; otherwise it talks / sends.
  cv.addEventListener('click', () => { unlock(); if (S.state === 'speaking') { stopSpeaking(); S.conversation = true; setState('idle'); startRec(); } else if (S.rec) stopRec(); else { S.conversation = true; S.turns = 0; startRec(); } });
  addEventListener('keydown', (e) => {
    if (e.target.closest('input, select, textarea')) return;
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); unlock(); if (S.rec) stopRec(); else { S.conversation = true; S.turns = 0; startRec(); } }
    if (e.key === 'Escape') { S.conversation = false; stopSpeaking(); stopRec(); setState('idle'); }
  });
  $('#handsfree').onclick = async () => {
    unlock();
    S.handsFree = !S.handsFree; $('#handsfree').setAttribute('aria-pressed', String(S.handsFree));
    if (S.handsFree) { try { await mic(); setState('idle', 'listening for you'); } catch (e) { S.handsFree = false; $('#handsfree').setAttribute('aria-pressed', 'false'); toast(`No microphone: ${e.message || e}`); } }
    else setState('idle');
  };
  $('#camera').onclick = () => camera(!S.camOn);
  $('#look').onclick = () => { unlock(); const img = frame(); if (!img) return; const seen = [...new Set(S.lastSeen)]; ask(seen.length ? `What do you see? (The camera spots: ${seen.join(', ')}.)` : 'What do you see?', { image: img }); };
  $('#keyboard').onclick = () => { const open = !$('#typed').classList.contains('open'); $('#typed').classList.toggle('open', open); document.body.classList.toggle('typing', open); $('#keyboard').setAttribute('aria-pressed', String(open)); if (open) $('#typed-in').focus(); };
  $('#typed').onsubmit = (e) => { e.preventDefault(); unlock(); const v = $('#typed-in').value.trim(); if (!v || S.busy) return; $('#typed-in').value = ''; ask(v, { image: S.camOn && /\b(see|look|this|ini|itu|lihat)\b/i.test(v) ? frame() : null }); };
  const muteIcon = () => { $('#mute').innerHTML = `<i class="fa-solid ${S.muted ? 'fa-volume-xmark' : 'fa-volume-high'}"></i>`; $('#mute').setAttribute('aria-pressed', String(S.muted)); };
  $('#mute').onclick = () => { unlock(); S.muted = !S.muted; store.set('lrm_p_muted', S.muted); if (S.muted) stopSpeaking(); muteIcon(); };
  muteIcon();
  $('#lang').value = store.get('lrm_p_lang', ''); $('#lang').onchange = () => store.set('lrm_p_lang', $('#lang').value);
  $('#voice').value = store.get('lrm_p_voice', 'device'); $('#voice').onchange = () => { store.set('lrm_p_voice', $('#voice').value); unlock(); };

  fetch('/api/lrm/voice', { credentials: 'same-origin' }).then(readJson).then((d) => {
    S.agent = d.agent;
    const name = d.agent?.name || 'Personal';
    $('#name').textContent = name.toUpperCase().slice(0, 10); $('#who').textContent = `${name} · personal assistant`; document.title = `${name} · LRMagent`;
    if (!d.voice?.ok) toast('The voice service is starting or not reachable yet; typed questions still work.');
    setState('idle');
  }).catch(() => { setState('idle'); toast('Sign in to the LRMagent console first.'); });
})();
</script>
</body>
