name: cowagent

services:
  cowagent:
    image: lrm-agents
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Pinned upstream build (v2.2.2). To update: README "Updating the upstream version".
        BASE_IMAGE: ${COWAGENT_IMAGE:-zhayujie/chatgpt-on-wechat@sha256:5e3d2bad4c4d63cb71cbf1acaa83b7cd10f07832fcf2a96c2a20f132075ae933}
    restart: unless-stopped
    # Same as the upstream compose file; the agent's browser tools need it.
    security_opt:
      - seccomp:unconfined
    # raw: values are taken literally, so a password with $, # or quotes survives.
    env_file:
      - path: ../.env.cowagent
        format: raw
      - path: ../.env.sandbox
        format: raw
    environment:
      # WhatsApp and API chats run their shell commands in the sandbox service below.
      LRMAGENT_SANDBOX_URL: http://sandbox:8099
      LRMAGENT_VOICE_URL: http://voice:8095
      CHANNEL_TYPE: web
      # Reachable by the ln Caddy proxy over the lnint-edge network; the host port below stays on loopback.
      WEB_HOST: 0.0.0.0
      WEB_PORT: 9899
      AGENT: 'True'
      AGENT_PERMISSION_MODE: full-access
      COW_DATA_DIR: /home/agent/.cow
      TZ: Asia/Jakarta
      # English only, and the agent introduces itself by the LRM name.
      COW_LANG: en
      DEFAULT_AGENT_NAME: Lorium
      # Owner decisions must come through Caddy from outside this server (agent/lrm_origin.py).
      SERVER_PUBLIC_IP: ${LRMAGENT_SERVER_IP:-43.152.240.47}
    ports:
      # For an SSH tunnel: ssh -L 9899:127.0.0.1:9899 ubuntu@43.152.240.47
      - "127.0.0.1:9899:9899"
    volumes:
      - workspace:/home/agent/cow
      - data:/home/agent/.cow
      # Photos and voice notes received over WhatsApp, read-only for the agent.
      - whatsapp_media:/media/whatsapp:ro
      # The Vault's Git panel talks to the vault sync on the host through this folder
      # (~/vault-sync/control; deploy/vault-control.sh).
      - ../../vault-sync/control:/home/agent/vault-control
    networks:
      default:
      edge:
        aliases: [cowagent]

  # WhatsApp Web (QR) links, one number per agent; Caddy routes /whatsapp/* here.
  whatsapp-gateway:
    image: lrm-whatsapp-gateway
    build:
      context: ../whatsapp-gateway
    restart: unless-stopped
    # raw: values are taken literally, so a password with $, # or quotes survives.
    env_file:
      - path: ../.env.whatsapp
        format: raw
    environment:
      COWAGENT_URL: http://cowagent:9899
      # Console visits from this server itself never count as the owner being around
      # (private vault): src/server.js fromOwnersBrowser.
      SERVER_PUBLIC_IP: ${LRMAGENT_SERVER_IP:-43.152.240.47}
    volumes:
      - whatsapp:/data
      - whatsapp_media:/media/whatsapp
      # Read-only, same path as in the agent, to attach files the agent links in replies.
      - workspace:/home/agent/cow:ro
    depends_on:
      - cowagent
    networks:
      default:
      edge:
        aliases: [whatsapp-gateway]

  # Shell commands from WhatsApp and API chats: the workspace, but none of LRMagent's
  # settings or keys (no data volume, no env file but its own token).
  sandbox:
    image: lrm-agents
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["python", "/app/agent/lrm_sandbox_server.py"]
    user: "999:999"
    env_file:
      - path: ../.env.sandbox
        format: raw
    environment:
      TZ: Asia/Jakarta
      HOME: /home/agent
      SANDBOX_ROOT: /home/agent/cow
    volumes:
      - workspace:/home/agent/cow
      - whatsapp_media:/media/whatsapp:ro
      # Commands from WhatsApp and API chats: Sora's private workspace is not there at all,
      # and the knowledge vault is read-only (it changes only through approved vault updates).
      - type: tmpfs
        target: /home/agent/cow/agents/personal
        tmpfs: { size: 1m }
      - type: bind
        source: /var/lib/docker/volumes/cowagent_workspace/_data/knowledge
        target: /home/agent/cow/knowledge
        read_only: true
        bind: { create_host_path: false }
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - cowagent

  # Coding teammates (Codex, Claude Code, Gemini, Grok, DeepSeek) on the owner's plans.
  teammates:
    image: lrm-teammates
    build:
      context: ../teammates
    restart: unless-stopped
    env_file:
      - path: ../.env.teammates
        format: raw
    environment:
      COWAGENT_URL: http://cowagent:9899
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:8080
      TZ: Asia/Jakarta
    volumes:
      # Sign-ins (Codex, Claude, Gemini, OpenCode): losing this means signing in again.
      - teammates_home:/home/node
      # Their project folders.
      - teammates_work:/work
      # Task records and logs.
      - teammates_data:/data
    mem_limit: 2g
    depends_on:
      - cowagent
    networks:
      default:
      edge:
        aliases: [teammates]

  # Voice for the personal assistant and WhatsApp voice replies: speech-to-text
  # (faster-whisper) and text-to-speech (Kokoro), on the CPU. Internal only.
  voice:
    image: lrm-voice
    build:
      context: ../voice
    restart: unless-stopped
    env_file:
      - path: ../.env.whatsapp
        format: raw
    environment:
      WHISPER_MODEL: small
      OMP_NUM_THREADS: "2"
      TZ: Asia/Jakarta
    volumes:
      - voice_models:/models
    mem_limit: 1600m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  # Shared only with the ln Caddy container, so the agent cannot reach the ln database.
  edge:
    name: lnint-edge
    external: true

volumes:
  workspace:
  data:
  # WhatsApp session keys: losing this volume means re-scanning every QR.
  whatsapp:
  # Received WhatsApp media; the gateway deletes files older than 7 days.
  whatsapp_media:
  teammates_home:
  teammates_work:
  teammates_data:
  # Speech models (Whisper, Kokoro), downloaded on first start.
  voice_models:
