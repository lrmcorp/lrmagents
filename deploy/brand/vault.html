<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault · LRMagent</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/brand/plus-jakarta-sans.css">
<link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" id="hl-light" href="/assets/vendor/highlightjs/styles/github.min.css">
<link rel="stylesheet" id="hl-dark" href="/assets/vendor/highlightjs/styles/github-dark.min.css" disabled>
<style>
  :root {
    --brand: #015f44; --brand-2: #0b7a5a; --brand-soft: #e2f2eb; --canvas: #f1f2f1; --surface: #fff; --surface-2: #f8faf9;
    --hover: #eef2f0; --active: #e2f2eb; --text: #101725; --text-2: #4f5967; --text-3: #6b7585; --line: #e0e4e9;
    --link: #0b7a5a; --unresolved: #b4581b; --mark: #fff1a8; --code-bg: #f3f5f4; --danger: #c0392b; --shadow: 0 10px 30px rgb(16 23 37 / .14);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root.dark {
    --brand: #3fbf8f; --brand-2: #5fd3a6; --brand-soft: #123528; --canvas: #0f1412; --surface: #161c1a; --surface-2: #1b2320;
    --hover: #212b27; --active: #1d3a2f; --text: #e6ebe9; --text-2: #b3bdb9; --text-3: #8a9591; --line: #2a3430;
    --link: #5fd3a6; --unresolved: #e39a62; --mark: #6b5b12; --code-bg: #1f2724; --shadow: 0 10px 30px rgb(0 0 0 / .5);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--text); font: 400 14px/1.5 'Plus Jakarta Sans', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }
  .icon-btn { border: 0; background: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--text-2); display: inline-grid; place-items: center; flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn[aria-pressed="true"] { color: var(--brand); background: var(--active); }

  /* ---- frame ---- */
  .app { display: grid; grid-template-rows: 44px 1fr 26px; height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
  .topbar .title { font-weight: 700; margin: 0 8px 0 4px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .topbar .title i { color: var(--brand); }
  .agent-select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 8px; max-width: 180px; }
  .spacer { flex: 1; }
  .body { display: grid; grid-template-columns: var(--left-w, 270px) 1fr var(--right-w, 280px); min-height: 0; }
  .body.no-left { grid-template-columns: 0 1fr var(--right-w, 280px); }
  .body.no-right { grid-template-columns: var(--left-w, 270px) 1fr 0; }
  .body.no-left.no-right { grid-template-columns: 0 1fr 0; }
  .pane { background: var(--surface-2); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .left { border-right: 1px solid var(--line); }
  .right { border-left: 1px solid var(--line); }
  .no-left .left, .no-right .right { border: 0; }
  .pane-tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); }
  .pane-tabs .icon-btn { width: auto; padding: 0 10px; gap: 6px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; }
  .pane-body { flex: 1; overflow: auto; padding: 6px; }
  .statusbar { display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 0 12px; font-size: 12px; color: var(--text-3); background: var(--surface); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
  .statusbar .conflict { color: var(--danger); font-weight: 600; }

  /* ---- file tree ---- */
  .tree-actions { display: flex; gap: 2px; padding: 2px 2px 6px; }
  .tree-row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; cursor: pointer; color: var(--text-2); white-space: nowrap; user-select: none; position: relative; }
  .tree-row:hover { background: var(--hover); color: var(--text); }
  .tree-row.active { background: var(--active); color: var(--text); font-weight: 600; }
  .tree-row.selected-folder > .name { color: var(--text); }
  .tree-row.drop { outline: 2px dashed var(--brand); outline-offset: -2px; }
  .tree-row .chev { width: 12px; font-size: 10px; color: var(--text-3); transition: transform .12s; flex: none; }
  .tree-row .chev.open { transform: rotate(90deg); }
  .tree-row .ico { width: 14px; text-align: center; font-size: 12px; color: var(--text-3); flex: none; }
  .tree-row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tree-row .badge { font-size: 10px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 6px; padding: 0 5px; }
  .tree-row .more { opacity: 0; width: 22px; height: 22px; }
  .tree-row:hover .more, .tree-row:focus-within .more { opacity: 1; }
  .tree-row.section { font-weight: 700; color: var(--text); margin-top: 4px; }
  .tree-row .ext { font-size: 10px; color: var(--text-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; }

  /* ---- lists in panes ---- */
  .pane-input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; outline: none; }
  .pane-input:focus { border-color: var(--brand); }
  .muted { color: var(--text-3); font-size: 12px; }
  .hint { color: var(--text-3); font-size: 12px; padding: 8px 6px; }
  .result { padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .result:hover { background: var(--hover); }
  .result .r-title { font-weight: 600; font-size: 13px; }
  .result .r-path { font-size: 11px; color: var(--text-3); }
  .result .r-hit { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .side-section { margin-bottom: 10px; }
  .side-head { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); padding: 6px 6px 4px; cursor: pointer; user-select: none; }
  .side-head .count { margin-left: auto; font-weight: 600; }
  .side-item { display: block; padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item:hover { background: var(--hover); color: var(--text); }
  .side-item.unresolved { color: var(--unresolved); }
  .side-item small { color: var(--text-3); }
  .outline-item { padding-left: calc(8px + var(--lvl) * 12px); }
  .tag-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; cursor: pointer; margin: 2px; border: 0; }
  .tag-chip small { color: var(--text-3); font-weight: 500; }

  /* ---- center ---- */
  .center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
  .tabbar { display: flex; align-items: flex-end; gap: 2px; padding: 6px 6px 0; background: var(--surface-2); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; min-height: 38px; }
  .tab { display: flex; align-items: center; gap: 6px; max-width: 200px; padding: 6px 8px 6px 12px; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--text-2); font-size: 13px; white-space: nowrap; border: 1px solid transparent; border-bottom: 0; }
  .tab:hover { background: var(--hover); }
  .tab.active { background: var(--surface); color: var(--text); border-color: var(--line); margin-bottom: -1px; padding-bottom: 7px; }
  .tab .t-name { overflow: hidden; text-overflow: ellipsis; }
  .tab .dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); flex: none; }
  .tab .close { width: 20px; height: 20px; border-radius: 5px; font-size: 11px; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .note-head { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .crumbs { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .crumbs span { cursor: pointer; }
  .crumbs span:hover { color: var(--text); }
  .scroller { flex: 1; overflow: auto; }
  .doc { max-width: 760px; margin: 0 auto; padding: 28px 32px 30vh; }
  .inline-title { width: 100%; border: 0; outline: none; background: none; font-size: 30px; font-weight: 800; letter-spacing: -.01em; padding: 0; margin: 0 0 12px; color: var(--text); }
  .inline-title:read-only { cursor: default; }
  .banner { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .banner.warn { background: #fff4e5; color: #7a4a00; border: 1px solid #f5d29c; }
  .banner.info { background: var(--brand-soft); color: var(--text); border: 1px solid var(--line); }
  :root.dark .banner.warn { background: #3a2a10; color: #f5d29c; border-color: #6b4d1a; }
  .banner button { border: 1px solid currentColor; background: none; border-radius: 7px; padding: 2px 10px; cursor: pointer; font-weight: 600; }
  .editor { width: 100%; min-height: 60vh; border: 0; outline: none; resize: none; background: none; font: 400 15px/1.7 'Plus Jakarta Sans', Inter, system-ui, sans-serif; color: var(--text); tab-size: 4; padding: 0; overflow: hidden; }

  /* ---- reading view (Obsidian-like) ---- */
  .md { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.3; margin: 1.4em 0 .5em; font-weight: 750; }
  .md h1 { font-size: 1.75em; } .md h2 { font-size: 1.45em; } .md h3 { font-size: 1.2em; } .md h4 { font-size: 1.05em; }
  .md > :first-child { margin-top: 0; }
  .md p { margin: .55em 0; }
  .md a { color: var(--link); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md a.internal { font-weight: 550; }
  .md a.unresolved { color: var(--unresolved); opacity: .85; }
  .md a.external::after { content: '\f35d'; font: 900 9px 'Font Awesome 6 Free'; margin-left: 3px; vertical-align: super; opacity: .6; }
  .md code { font: 13px var(--mono); background: var(--code-bg); border-radius: 5px; padding: 1px 5px; }
  .md pre { background: var(--code-bg); border-radius: 10px; padding: 12px 14px; overflow: auto; }
  .md pre code { background: none; padding: 0; font-size: 13px; }
  .md pre code.hljs { background: none; padding: 0; }
  .md blockquote { margin: .8em 0; padding: 2px 14px; border-left: 3px solid var(--brand); color: var(--text-2); }
  .md table { border-collapse: collapse; margin: .8em 0; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; }
  .md th { background: var(--surface-2); }
  .md img { max-width: 100%; border-radius: 8px; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
  .md ul, .md ol { padding-left: 1.6em; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task > input, .md li.task > p > input { margin-right: 6px; accent-color: var(--brand); cursor: pointer; }
  .md li.task.done { color: var(--text-3); text-decoration: line-through; }
  .md mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  .md .tag { color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 1px 8px; font-size: .85em; font-weight: 600; cursor: pointer; text-decoration: none; }
  .md .embed { border-left: 3px solid var(--line); padding: 4px 0 4px 14px; margin: .8em 0; }
  .md .embed-title { font-size: 12px; color: var(--text-3); margin-bottom: 4px; cursor: pointer; }
  .md .callout { --c: 2 95 68; border-left: 0; border-radius: 10px; background: rgb(var(--c) / .08); border: 1px solid rgb(var(--c) / .25); padding: 10px 14px; color: var(--text); }
  .md .callout-title { font-weight: 700; color: rgb(var(--c)); display: flex; gap: 8px; align-items: center; cursor: default; }
  .md .callout.foldable .callout-title { cursor: pointer; }
  .md .callout.folded > :not(.callout-title) { display: none; }
  .md .callout[data-callout="warning"], .md .callout[data-callout="caution"], .md .callout[data-callout="attention"] { --c: 200 120 0; }
  .md .callout[data-callout="danger"], .md .callout[data-callout="error"], .md .callout[data-callout="bug"], .md .callout[data-callout="failure"] { --c: 200 50 50; }
  .md .callout[data-callout="tip"], .md .callout[data-callout="success"], .md .callout[data-callout="check"], .md .callout[data-callout="done"] { --c: 20 150 90; }
  .md .callout[data-callout="info"], .md .callout[data-callout="todo"], .md .callout[data-callout="abstract"], .md .callout[data-callout="summary"] { --c: 30 110 210; }
  .md .callout[data-callout="question"], .md .callout[data-callout="faq"], .md .callout[data-callout="help"] { --c: 190 120 20; }
  .md .callout[data-callout="quote"], .md .callout[data-callout="cite"], .md .callout[data-callout="example"] { --c: 120 90 200; }
  :root.dark .md .callout { --c: 95 211 166; }
  .props { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 0 0 18px; font-size: 13px; background: var(--surface-2); }
  .props .prow { display: grid; grid-template-columns: 120px 1fr; gap: 8px; padding: 3px 0; }
  .props .pkey { color: var(--text-3); display: flex; gap: 6px; align-items: center; }
  .props-head { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .backlinks-foot { max-width: 760px; margin: 0 auto; padding: 0 32px 40px; }

  /* ---- graph ---- */
  .graph-wrap { flex: 1; position: relative; min-height: 0; background: var(--surface); }
  .graph-wrap svg { width: 100%; height: 100%; display: block; cursor: grab; }
  .graph-ctrl { position: absolute; top: 10px; right: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 220px; font-size: 12px; box-shadow: var(--shadow); display: grid; gap: 8px; }
  .graph-ctrl label { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .graph-ctrl input[type=checkbox], .graph-ctrl input[type=range] { accent-color: var(--brand); }
  .graph-legend { position: absolute; left: 10px; bottom: 10px; font-size: 11px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 60%; }
  .graph-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .graph-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .g-label { font-size: 11px; fill: var(--text-2); pointer-events: none; }
  .empty-state { margin: auto; text-align: center; color: var(--text-2); padding: 40px 20px; max-width: 420px; }
  .empty-state h2 { margin: 12px 0 6px; font-size: 18px; color: var(--text); }
  .empty-state .actions { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; align-items: center; }
  .link-btn { border: 0; background: none; color: var(--link); cursor: pointer; font-weight: 600; padding: 2px; }
  .link-btn kbd, .modal kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--text-3); background: var(--surface-2); }

  /* ---- menus & modals ---- */
  .menu { position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; min-width: 190px; }
  .menu button { display: flex; width: 100%; gap: 10px; align-items: center; border: 0; background: none; padding: 6px 10px; border-radius: 7px; cursor: pointer; text-align: left; font-size: 13px; }
  .menu button:hover { background: var(--hover); }
  .menu button.danger { color: var(--danger); }
  .menu button i { width: 14px; color: var(--text-3); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px; }
  .overlay { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / .25); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
  .modal { width: min(560px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .modal input.q { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; outline: none; font-size: 16px; background: none; }
  .modal .list { max-height: 50vh; overflow: auto; padding: 6px; }
  .modal .opt { padding: 7px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .modal .opt.sel { background: var(--active); }
  .modal .opt .o-sub { margin-left: auto; font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
  .modal .foot { border-top: 1px solid var(--line); padding: 6px 12px; font-size: 11px; color: var(--text-3); display: flex; gap: 14px; }
  .modal .msg { padding: 16px; }
  .modal .msg h3 { margin: 0 0 6px; font-size: 16px; }
  .modal .msg input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; outline: none; background: var(--surface-2); }
  .modal .msg input:focus { border-color: var(--brand); }
  .modal .btns { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  :root.dark .btn.primary { color: #06140f; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .suggest { position: fixed; z-index: 45; width: 300px; max-height: 260px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; }
  .suggest .opt { padding: 5px 9px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .suggest .opt.sel { background: var(--active); }
  .suggest .opt small { display: block; color: var(--text-3); font-size: 11px; }
  .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
  .toast.error { background: var(--danger); color: #fff; }

  /* ---- small screens: side panes slide over the note ---- */
  @media (max-width: 900px) {
    .body, .body.no-left, .body.no-right, .body.no-left.no-right { grid-template-columns: minmax(0, 1fr); }
    .center { grid-column: 1; grid-row: 1; }
    .pane { position: fixed; top: 44px; bottom: 26px; z-index: 30; width: min(300px, 86vw); box-shadow: var(--shadow); }
    .left { left: 0; } .right { right: 0; }
    .body.no-left .left, .body.no-right .right { display: none; }
    .doc { padding: 20px 16px 30vh; }
    .backlinks-foot { padding: 0 16px 40px; }
    .topbar .title span, .hide-sm { display: none; }
    .graph-ctrl { width: 180px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="toggle-left" title="Toggle file explorer" aria-pressed="true"><i class="fa-solid fa-table-columns"></i></button>
    <div class="title"><i class="fa-solid fa-gem"></i><span>Vault</span></div>
    <select class="agent-select" id="agent" title="Whose memory to show"></select>
    <div class="spacer"></div>
    <button class="icon-btn" id="btn-switcher" title="Quick switcher (Ctrl/⌘ O)"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button class="icon-btn" id="btn-daily" title="Open today's daily note"><i class="fa-regular fa-calendar"></i></button>
    <button class="icon-btn" id="btn-graph" title="Graph view (Ctrl/⌘ G)"><i class="fa-solid fa-diagram-project"></i></button>
    <button class="icon-btn" id="btn-palette" title="Command palette (Ctrl/⌘ P)"><i class="fa-solid fa-terminal"></i></button>
    <button class="icon-btn" id="toggle-right" title="Toggle backlinks and outline" aria-pressed="true"><i class="fa-solid fa-table-columns fa-flip-horizontal"></i></button>
  </header>

  <div class="body" id="body">
    <aside class="pane left" id="left">
      <div class="pane-tabs" role="tablist">
        <button class="icon-btn" data-left="files" aria-pressed="true" title="Files"><i class="fa-regular fa-folder"></i><span class="hide-sm">Files</span></button>
        <button class="icon-btn" data-left="search" title="Search (Ctrl/⌘ Shift F)"><i class="fa-solid fa-magnifying-glass"></i><span class="hide-sm">Search</span></button>
        <button class="icon-btn" data-left="tags" title="Tags"><i class="fa-solid fa-hashtag"></i><span class="hide-sm">Tags</span></button>
      </div>
      <div class="pane-body" id="left-files">
        <div class="tree-actions">
          <button class="icon-btn" id="btn-new-note" title="New note (Ctrl/⌘ N)"><i class="fa-regular fa-pen-to-square"></i></button>
          <button class="icon-btn" id="btn-new-folder" title="New folder"><i class="fa-regular fa-folder-open"></i></button>
          <button class="icon-btn" id="btn-collapse" title="Collapse all"><i class="fa-solid fa-angles-up"></i></button>
          <button class="icon-btn" id="btn-refresh" title="Reload from disk"><i class="fa-solid fa-rotate"></i></button>
        </div>
        <div id="tree" role="tree"></div>
      </div>
      <div class="pane-body" id="left-search" hidden>
        <input class="pane-input" id="search-q" placeholder="Search notes…  (tag:#name works too)" autocomplete="off">
        <div id="search-results"></div>

      <div class="pane-body" id="left-tags" hidden><div id="tag-list"></div></div>

    <main class="center">
      <div class="tabbar" id="tabbar"></div>
      <div class="view" id="view"></div>

    <aside class="pane right" id="right">

        <button class="icon-btn" data-right="outline" title="Outline"><i class="fa-solid fa-list-ul"></i><span class="hide-sm">Outline</span></button>
        <button class="icon-btn" data-right="info" title="Tags and properties"><i class="fa-solid fa-circle-info"></i><span class="hide-sm">Info</span></button>
      </div>
      <div class="pane-body" id="right-body"></div>
