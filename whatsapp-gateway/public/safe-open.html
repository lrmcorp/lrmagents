<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Private vault</title>
<style>
  :root { --text: #0a0a0f; --text-2: #3f3f46; --text-3: #64646c; --line: #dbdbe5; --bg: #f9f9fb; --bad: #be123c; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 Inter, -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: var(--text-2); margin: 0 0 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  input { font: inherit; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0 10px; }
  button { font: 600 14px inherit; font-family: inherit; padding: 10px 16px; border-radius: 10px; border: 1px solid #18181b; background: #18181b; color: #fff; cursor: pointer; }
  button.small { padding: 4px 10px; font-size: 12px; background: #fff; color: var(--text); border-color: var(--line); }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; }
  .item h3 { margin: 0 0 8px; font-size: 16px; }
  .field { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid #f0f0f5; }
  .field small { color: var(--text-3); font-size: 12px; font-weight: 600; }
  .field code { font: 14px ui-monospace, Menlo, monospace; word-break: break-all; }
  pre { white-space: pre-wrap; font: inherit; margin: 0; }
  .muted { color: var(--text-3); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Private vault</h1>
  <p id="lede">This was sent to you because its owner did not respond for 7 days. It is locked: type the passphrase they gave you.</p>
  <div class="card" id="ask">
    <label for="pass"><b>Passphrase</b></label>
    <input id="pass" type="password" autocomplete="off" autofocus>
    <div class="err" id="err"></div>
    <button id="go">Open</button>
    <p class="muted" style="margin-top:12px">It is opened on this device only. Nobody else can read it without the passphrase.</p>
  </div>
  <div id="out" hidden></div>
</main>
<script id="data" type="application/json">__SAFE_DATA__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  if (D.test) { const b = document.createElement('p'); b.style.cssText = 'background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:10px'; b.textContent = 'TEST: this is what your person would receive. Only you got this one.'; document.querySelector('main').prepend(b); }
  if (D.ownerName) { $('#title').textContent = `Private vault from ${D.ownerName}`; document.title = $('#title').textContent; }
  if (D.recipient) $('#lede').textContent = `Hello ${D.recipient}. ${D.ownerName || 'Its owner'} asked for this to be sent to you if they did not respond for 7 days. It is locked: type the passphrase they gave you.`;

  async function open() {
    $('#err').textContent = '';
    if (!window.crypto?.subtle) { $('#err').textContent = 'This browser cannot open it here. Open the link in Chrome or Safari instead.'; return; }
    $('#go').disabled = true; $('#go').textContent = 'Opening…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('#pass').value.normalize('NFKC')), 'PBKDF2', false, ['deriveBits']);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, 512));
      const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(D.iv) }, key, unb64(D.ct));
      show(JSON.parse(new TextDecoder().decode(plain)));
    } catch {
      $('#err').textContent = 'That passphrase does not open it. Check spelling, spaces and capital letters.';
    } finally { $('#go').disabled = false; $('#go').textContent = 'Open'; }
  }
  function show(v) {
    $('#ask').hidden = true; $('#pass').value = '';
    const field = (label, value, secret) => value ? `<div class="field"><small>${label}</small><code>${esc(value)}</code><button class="small" data-copy="${esc(value)}">Copy</button></div>` : '';
    const items = (v.items || []).map((e) => `<div class="card item"><h3>${esc(e.title || 'Login')}</h3>
      ${field('Username', e.user)}${field('Password', e.secret)}${field('Website', e.url)}${e.notes ? `<div class="field"><small>Notes</small><span>${esc(e.notes)}</span><span></span></div>` : ''}</div>`).join('');
    $('#out').innerHTML = (items || '') + (v.notes ? `<div class="card"><h3 style="margin:0 0 8px">Notes</h3><pre>${esc(v.notes)}</pre></div>` : '') +
      '<p class="muted">Keep this safe. Close this page when you are done.</p>';
    $('#out').hidden = false;
  }
  $('#go').onclick = open;
  $('#pass').onkeydown = (e) => { if (e.key === 'Enter') open(); };
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-copy]'); if (!b) return; navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1500); }); });
})();
</script>
</body>
</html>
