name: cowagent

services:
  cowagent:
    image: lrm-agents
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BASE_IMAGE: ${COWAGENT_IMAGE:-zhayujie/chatgpt-on-wechat:latest}
    restart: unless-stopped
    # Same as upstream CowAgent compose; the agent's browser tools need it.
    security_opt:
      - seccomp:unconfined
    env_file: ../.env.cowagent
    environment:
      CHANNEL_TYPE: web
      # Reachable by the ln Caddy proxy over the lnint-edge network; the host port below stays on loopback.
      WEB_HOST: 0.0.0.0
      WEB_PORT: 9899
      AGENT: 'True'
      AGENT_PERMISSION_MODE: full-access
      COW_DATA_DIR: /home/agent/.cow
      TZ: Asia/Jakarta
      # English only, and the agent introduces itself by the LRM name.
      COW_LANG: en
      DEFAULT_AGENT_NAME: LRM Agents
    ports:
      # For an SSH tunnel: ssh -L 9899:127.0.0.1:9899 ubuntu@43.152.240.47
      - "127.0.0.1:9899:9899"
    volumes:
      - workspace:/home/agent/cow
      - data:/home/agent/.cow
    networks:
      default:
      edge:
        aliases: [cowagent]

  # WhatsApp Web (QR) links, one number per agent; Caddy routes /whatsapp/* here.
  whatsapp-gateway:
    image: lrm-whatsapp-gateway
    build:
      context: ../whatsapp-gateway
    restart: unless-stopped
    env_file: ../.env.whatsapp
    environment:
      COWAGENT_URL: http://cowagent:9899
    volumes:
      - whatsapp:/data
    depends_on:
      - cowagent
    networks:
      default:
      edge:
        aliases: [whatsapp-gateway]

networks:
  # Shared only with the ln Caddy container, so the agent cannot reach the ln database.
  edge:
    name: lnint-edge
    external: true

volumes:
  workspace:
  data:
  # WhatsApp session keys: losing this volume means re-scanning every QR.
  whatsapp:
