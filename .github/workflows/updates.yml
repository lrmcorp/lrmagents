name: LRMagent update check

# Weekly: is there a newer upstream agent image or WhatsApp library than the
# pinned ones? Opens (or updates) one issue; nothing is changed automatically,
# because both can break things (README "Updating the upstream version").
on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: 'LRMagent update available'
      LABEL: lrmagent-updates
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Compare pinned versions with the latest releases
        run: |
          pinned_image="$(grep -oE 'sha256:[0-9a-f]{64}' deploy/Dockerfile | head -1)"
          latest_image="$(docker buildx imagetools inspect zhayujie/chatgpt-on-wechat:latest | awk '/^Digest:/ {print $2; exit}')"
          pinned_wa="$(python3 -c 'import json; print(json.load(open("whatsapp-gateway/package.json"))["dependencies"]["baileys"])')"
          latest_wa="$(npm view baileys dist-tags.latest)"
          echo "image: pinned $pinned_image, latest ${latest_image:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "baileys: pinned $pinned_wa, latest ${latest_wa:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          : > updates.md
          # Teammate CLIs pinned in teammates/Dockerfile.
          for pair in CODEX_VERSION:@openai/codex CLAUDE_CODE_VERSION:@anthropic-ai/claude-code GEMINI_CLI_VERSION:@google/gemini-cli OPENCODE_VERSION:opencode-ai; do
            arg="${pair%%:*}"; pkg="${pair#*:}"
            pinned="$(sed -n "s/^ARG $arg=//p" teammates/Dockerfile)"; latest="$(npm view "$pkg" version 2>/dev/null || true)"
            echo "$pkg: pinned $pinned, latest ${latest:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
            if [[ -n "$latest" && "$latest" != "$pinned" ]]; then
              echo "- **Teammate $pkg:** $latest is out (pinned $pinned). Bump \`$arg\` in \`teammates/Dockerfile\`; sign-in and run flags are checked by \`teammates\` tests." >> updates.md
            fi
          done
          if [[ -n "$latest_image" && "$latest_image" != "$pinned_image" ]]; then
            echo "- **Agent base image:** a newer \`zhayujie/chatgpt-on-wechat:latest\` is out (\`$latest_image\`, pinned \`$pinned_image\`). Update the digest in \`deploy/Dockerfile\` and \`deploy/compose.yaml\`; the deploy's build step checks every brand patch still applies." >> updates.md
          fi
          if [[ -n "$latest_wa" && "$latest_wa" != "$pinned_wa" ]]; then
            echo "- **WhatsApp library (Baileys):** $latest_wa is out (pinned $pinned_wa). WhatsApp protocol changes can break older versions; bump it in \`whatsapp-gateway/package.json\`, run \`npm install\` and the tests." >> updates.md
          fi
      - name: Open or update the issue
        run: |
          if [[ ! -s updates.md ]]; then echo "Up to date."; exit 0; fi
          # Only an issue this workflow opened counts, so nobody else's issue gets the bot's comments.
          gh label create "$LABEL" --color 0E8A16 --description "Opened by the LRMagent update check" >/dev/null 2>&1 || true
          issue="$(gh api "repos/$GH_REPO/issues?state=open&labels=$LABEL&creator=github-actions%5Bbot%5D&per_page=20" \
            --jq "map(select(.user.login == \"github-actions[bot]\" and .title == \"$TITLE\" and (.pull_request | not))) | .[0].number // empty")"
          body="$(printf 'Checked %s UTC:\n\n' "$(date -u '+%Y-%m-%d')"; cat updates.md)"
          last=""
          if [[ -n "$issue" ]]; then
            last="$(gh api "repos/$GH_REPO/issues/$issue/comments?per_page=100" --jq 'map(select(.user.login == "github-actions[bot]")) | last | .body // empty')"
            [[ -n "$last" ]] || last="$(gh api "repos/$GH_REPO/issues/$issue" --jq .body)"
          fi
          if [[ -z "$issue" ]]; then
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          elif [[ "$(printf '%s\n' "$last" | grep '^- ')" != "$(cat updates.md)" ]]; then
            gh issue comment "$issue" --body "$body"
          fi
